services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vitrio}
      DB_USER: ${POSTGRES_USER:-vitrio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vitrio}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-signing-key-never-use-in-production-1234567890}
      VITRIO_CORS_ALLOWED_ORIGINS: ${VITRIO_CORS_ALLOWED_ORIGINS:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      VITRIO_RATE_LIMIT_REGISTER_CAPACITY: ${VITRIO_RATE_LIMIT_REGISTER_CAPACITY:-10}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitrio}
      POSTGRES_USER: ${POSTGRES_USER:-vitrio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitrio} -d ${POSTGRES_DB:-vitrio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
