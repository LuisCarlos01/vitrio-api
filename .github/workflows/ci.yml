name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # codeql-action (v3 e v4, tags flutuantes que já receberam essa mudança) chama a API de
      # workflow-runs pra telemetria/contexto do job — sem isso o step falha com "Resource not
      # accessible by integration", mesmo o upload do SARIF em si não precisando desse escopo.
      actions: read
    steps:
      - uses: actions/checkout@v7

      # SARIF alimenta o Security tab do GitHub e exit-code falha a pipeline (e por
      # consequência o deploy.yml, que só dispara com a run inteira do CI em sucesso)
      # no mesmo scan — CVE CRITICAL/HIGH com correção disponível, secret exposto ou
      # misconfig no Dockerfile/compose. limit-severities-for-sarif é obrigatório aqui:
      # sem ele, a action ignora o filtro `severity` ao gerar SARIF (aplica a todas as
      # severidades) e o exit-code passa a refletir isso, não o filtro configurado.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          limit-severities-for-sarif: true

      # if: always() garante a tentativa mesmo quando o step acima falhou o job (exit-code: 1 já
      # reprovou a run; isso só preserva o relatório no Security tab). continue-on-error: true
      # porque este step é só relatório/visibilidade — o gate de segurança de verdade é o
      # exit-code do "Trivy scan" acima, que já falha a run sozinho. "Code scanning" precisa ser
      # habilitado manualmente em Settings → Code security and analysis (não é um toggle de API);
      # até isso ser feito, este step falha, mas não deve travar CI/deploy por causa disso.
      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
