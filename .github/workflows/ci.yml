name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # SARIF alimenta o Security tab do GitHub e exit-code falha a pipeline (e por
      # consequência o deploy.yml, que só dispara com a run inteira do CI em sucesso)
      # no mesmo scan — CVE CRITICAL/HIGH com correção disponível, secret exposto ou
      # misconfig no Dockerfile/compose. limit-severities-for-sarif é obrigatório aqui:
      # sem ele, a action ignora o filtro `severity` ao gerar SARIF (aplica a todas as
      # severidades) e o exit-code passa a refletir isso, não o filtro configurado.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          limit-severities-for-sarif: true

      # if: always() garante o upload mesmo quando o step acima falhou o job
      # (exit-code: 1 já reprovou a run; isso só preserva o relatório no Security tab).
      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
